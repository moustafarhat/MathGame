name: Build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build MathGame.sln --configuration Release

    - name: Test
      run: dotnet test MathGame.sln --configuration Release --no-build

  publish:
    needs: test
    strategy:
      matrix:
        rid: [ win-x64, linux-x64, osx-arm64, osx-x64 ]
    # Avalonia cross-publishes, so one Linux runner builds every platform.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: >
        dotnet publish MathGame/MathGame.csproj
        --configuration Release
        --runtime ${{ matrix.rid }}
        --self-contained
        -p:PublishSingleFile=true
        --output publish/${{ matrix.rid }}

    - uses: actions/upload-artifact@v4
      with:
        name: MathGame-${{ matrix.rid }}
        path: publish/${{ matrix.rid }}
